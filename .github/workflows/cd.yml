name: CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  permissions:
    contents: read
    packages: write

jobs:

  docker:
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw verify -B

      - name: Login do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagem docker
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/academia-api:${{ github.sha }} .

      - name: Enviar imagem para o GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/academia-api:${{ github.sha }}