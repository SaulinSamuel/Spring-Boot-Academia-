name: CI

on:
  push:
    branches:
          - main
          - develop
        
  pull_request:
    branches:
          - main
          - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:  
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e build
        run: ./mvnw verify